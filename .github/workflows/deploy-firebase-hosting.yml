name: Deploy to Firebase Hosting

# Real-world incident, 2026-10-31: `firestore.rules` is this project's actual security boundary
# (see the file's own header comment), but — unlike every other part of this app — it was never
# deployed by anything automated. It had to be copy-pasted by hand into Firebase Console →
# Firestore Database → Rules → Publish, every single time it changed. That manual step was
# apparently skipped for a long stretch: a live incident (commitReconcile's real-deduction
# transaction throwing permission-denied on a write this session had independently verified, via
# a real Firestore emulator running the actual firestore.rules file, as VALID) turned out to be
# exactly this — the deployed rules were stale, not the app code or the rules file itself. Once
# the person manually re-published the current file, the live incident this comment's own commit
# was written to fix stopped recurring. Deploying `firestore:rules` here, on every push to main
# alongside Hosting, closes that gap for good: from now on, a merged `firestore.rules` change is
# live within the same few minutes the app code is, with no separate manual step to forget.
#
# Real-world report: a hospital pharmacist found that hard-refreshing the GitHub Pages-hosted
# app did not pick up a just-merged fix, sometimes for several minutes. GitHub Pages is served
# through a CDN (Fastly) with no way for this repo to set its own Cache-Control headers — the
# service worker script (sw.js) itself could sit cached at the CDN edge for a while, so even a
# correct, cache-busting update check from the app's own code (see AppContext.tsx's
# registration.update() calls) could keep finding the same stale sw.js. Firebase Hosting (this
# project already runs on Firebase) DOES let a repo set explicit response headers (firebase.json)
# — sw.js/index.html/manifest.webmanifest are marked no-cache there, so every update check is
# guaranteed to reach the real origin, while the content-hashed JS/CSS chunks under /assets/ are
# still cached for a year (safe — a changed file gets a new hash, never the same URL).
#
# This REPLACES GitHub Pages as the fast-path URL going forward (see firebase.json's own comment
# for the header reasoning). It does not touch deploy-pages.yml — the old
# rxanasmyt.github.io/OPD-DRUG-STOCK-MANAGER/ URL keeps working exactly as before (still slow to
# notice updates) so nobody's already-installed home-screen icon breaks overnight; staff switch
# over to the new Firebase Hosting URL (https://opd-drug-stock.web.app/) at their own pace by
# re-adding the home-screen icon from that URL, then deploy-pages.yml can be retired once
# everyone has.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Same reasoning as deploy-pages.yml's own concurrency block: queue (never cancel) so two quick
# successive pushes can't race and leave the live site on a mismatched bundle.
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # See ci.yml's own comment on this pin — Node 20 fails `npm test` on this repo's
          # jsdom/undici combo.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Same reasoning as deploy-pages.yml: a change that type-checks and builds but fails
      # vitest must never still reach a live, safety-critical stock app.
      - run: npm test
      # No GITHUB_PAGES env var here (unlike deploy-pages.yml) — vite.config.ts's `base`
      # defaults to '/', correct for Firebase Hosting serving from its own domain root rather
      # than a GitHub Pages project-site subpath.
      - run: npm run build
      # Bug fix (real incident, 2026-10-31 — same day as the fix this step was first added in):
      # `deploy --only hosting,firestore:rules` in ONE command made Hosting's own deploy depend on
      # firestore:rules succeeding too — `firebase deploy` validates EVERY requested target before
      # deploying ANY of them, so the service account lacking the Firebase Rules Admin IAM role
      # (confirmed via this exact job's own failed run: "Request to
      # https://firebaserules.googleapis.com/v1/projects/opd-drug-stock:test had HTTP Error: 403,
      # The caller does not have permission") made the WHOLE deploy exit before Hosting ever ran —
      # silently breaking the previously-working, unrelated Hosting pipeline the instant rules
      # deploy was added. Split into two separate deploy commands: Hosting first and on its own
      # (so it can never again be blocked by an unrelated Firestore-rules permission problem), then
      # rules deploy as its own step below — if THAT fails, only its own step goes red in the
      # Actions tab (clearly visible, not silent) without taking Hosting down with it.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only hosting --project opd-drug-stock --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
      # Needs the service account to hold the "Firebase Rules Admin" IAM role (or broader, e.g.
      # "Editor") on the opd-drug-stock GCP project — Hosting/Firestore-data access alone (what the
      # account already had) does NOT cover the separate firebaserules.googleapis.com API this
      # calls. Deliberately its own step (see the comment above) so a missing role here shows up
      # as exactly one red step in the Actions tab instead of taking the rest of the deploy down.
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project opd-drug-stock --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
      # Same script, same reasoning as deploy-pages.yml's own copy of this step — pushes the
      # new version to every tab already open on the NEW (Firebase Hosting) URL in real time via
      # Firestore, instead of waiting on the service worker's own up-to-3-minute poll.
      # continue-on-error: a hiccup here must never mark the deploy itself as failed — the real
      # deploy already succeeded by this point.
      - run: node scripts/publish-app-version.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        continue-on-error: true
