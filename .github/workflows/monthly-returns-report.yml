name: Monthly Returns Report (LINE)

# On the 1st of every month, 09:00 Asia/Bangkok: send the previous month's drug-return (คืนยา) report to the LINE group via MOPH Notify —
# an overview, 6-month trend, breakdown by drug category, breakdown by return reason, and top returned drugs. Each card links into the
# app's ↩️ รายงานคืนยา at that month/view. Needs FIREBASE_SERVICE_ACCOUNT_KEY, MOPH_NOTIFY_CLIENT_KEY, MOPH_NOTIFY_SECRET_KEY.
# Run by hand for any month: Actions → Run workflow → month (YYYY-MM); tick dry_run to only print the totals in the log.

# Exact Thai time: GitHub's scheduler is UTC and often starts runs minutes late, so the job starts 30 min EARLY and the script waits for the exact
# Bangkok minute (TARGET_TIME_BKK, set only for scheduled runs) before reading data and sending. A manual run sends at once.
on:
  schedule:
    - cron: '30 1 1-3 * *' # starts 08:30 Asia/Bangkok on the 1st–3rd (= 01:30 UTC; the script sends only on the first Mon–Fri of the month); sends at exactly 09:00
  workflow_dispatch:
    inputs:
      month:
        description: 'เดือนที่รายงาน (YYYY-MM) — เว้นว่างเพื่อใช้เดือนที่แล้ว'
        required: false
        default: ''
      dry_run:
        description: 'ทดสอบ: พิมพ์สรุปใน log แต่ไม่ส่งเข้า LINE'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/notify-monthly-returns.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          TARGET_TIME_BKK: ${{ github.event_name == 'schedule' && '09:00' || '' }}
          REPORT_MONTH: ${{ inputs.month }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          MOPH_NOTIFY_CLIENT_KEY: ${{ secrets.MOPH_NOTIFY_CLIENT_KEY }}
          MOPH_NOTIFY_SECRET_KEY: ${{ secrets.MOPH_NOTIFY_SECRET_KEY }}
