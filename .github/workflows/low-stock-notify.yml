name: Low-Stock LINE Notify

# Daily LINE broadcast when any active drug is below its Min (floor) or substock par — the
# free-tier (no backend) alternative to a push notification, since this static site has nothing
# that can wake a closed browser. See scripts/notify-low-stock.mjs for exactly what triggers a
# message and how it's built; it sends nothing on a day where nothing is actually low.
#
# One-time setup (do this once):
#   1. Create a LINE Official Account (free) at https://www.linebiz.com/th/entry/ (or via the
#      LINE Official Account Manager app) — this becomes "รพ.กรงปินัง ห้องยา" or similar. Every
#      staff member who wants the alert adds this account as a friend once (scan its QR code) —
#      that's the entire "who gets notified" list; no group/user IDs to manage.
#   2. In the LINE Developers Console (https://developers.line.biz/console/), open that Official
#      Account's provider → create/open a "Messaging API" channel for it.
#   3. Under that channel's "Messaging API" tab → "Channel access token" → issue a long-lived
#      token.
#   4. This repo → Settings → Secrets and variables → Actions → New repository secret → name it
#      LINE_CHANNEL_ACCESS_TOKEN → paste that token.
#   5. This workflow also needs the same FIREBASE_SERVICE_ACCOUNT_KEY secret
#      .github/workflows/firestore-backup.yml already documents setting up (read-only access to
#      today's real stock numbers) — if that's already configured for this repo, nothing more to
#      do there.
#
# Alternative/additional channel — MOPH Notify (LINE group with the "หมอพร้อม" bot): add repository secrets
# MOPH_NOTIFY_CLIENT_KEY and MOPH_NOTIFY_SECRET_KEY (from the unit's page in the MOPH Notify CMS). With only these two
# set, LINE_CHANNEL_ACCESS_TOKEN is not needed.
#
# Until a channel's secrets exist, this workflow fails every run with a clear "env var is not set"
# error (see the script) rather than silently sending nothing.

# Exact Thai time: GitHub's scheduler is UTC and often starts runs minutes late, so the job starts 30 min EARLY and the script waits for the exact
# Bangkok minute (TARGET_TIME_BKK, set only for scheduled runs) before reading data and sending. A manual run sends at once.
on:
  schedule:
    - cron: '0 1 * * 1-5' # starts 08:00 Asia/Bangkok Mon–Fri (= 01:00 UTC); sends at exactly 08:30 (office hours 08:30–16:30; a late start still sends until 16:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ทดสอบ: อ่านข้อมูลจริงและพิมพ์ข้อความใน log แต่ไม่ส่งเข้า LINE'
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # See firestore-backup.yml's own comment on this same bump — kept in step with
          # ci.yml/deploy-pages.yml's pin at 22 to avoid the same landmine.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/notify-low-stock.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # MOPH Notify → a LINE group with the "หมอพร้อม" bot (same channel EB Notify uses). Optional; either or both channels may be set.
          TARGET_TIME_BKK: ${{ github.event_name == 'schedule' && '08:30' || '' }}
          MOPH_NOTIFY_CLIENT_KEY: ${{ secrets.MOPH_NOTIFY_CLIENT_KEY }}
          MOPH_NOTIFY_SECRET_KEY: ${{ secrets.MOPH_NOTIFY_SECRET_KEY }}
          # Emergency-requisition horizon (optional repo *variables*, Settings → Variables): NEXT_DELIVERY_DATE = YYYY-MM-DD of the
          # next regular warehouse delivery; otherwise REQ_HORIZON_DAYS (default 7). Drugs that will run out sooner are flagged 🚨.
          NEXT_DELIVERY_DATE: ${{ vars.NEXT_DELIVERY_DATE }}
          REQ_HORIZON_DAYS: ${{ vars.REQ_HORIZON_DAYS }}
