name: CI

# Type-checks and runs the unit test suite (see src/**/*.test.ts, added in v2.87.0) on every
# push and pull request against any branch — deploy-pages.yml only ever builds+deploys pushes
# to `main`, so before this workflow existed nothing validated a change on a feature branch or
# a PR until someone manually ran tsc/tests locally (or it silently landed broken). Deliberately
# does NOT deploy anything — this is a pure gate, kept separate from deploy-pages.yml so a red
# CI run here can never accidentally publish a broken build.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Bug fix: pinned at 20 since this workflow was added, but every run since at least
          # v3.58.0 has failed on `npm test` with "TypeError: webidl.util.markAsUncloneable is
          # not a function" inside jsdom's bundled undici (node_modules/undici/lib/web/cache/
          # cachestorage.js) — a known jsdom-30/undici-8 incompatibility with Node 20's older
          # built-ins, unrelated to any app code change (confirmed: every CI run in the log back
          # to v3.58.0 failed the same way, including ones that only touched docs/CSS). Node 22
          # (what this repo's own dev/build environment already runs, where the same test suite
          # passes clean) doesn't hit it — bumping the pin here instead of guessing at a jsdom
          # downgrade, since 22 is already the proven-working version.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
