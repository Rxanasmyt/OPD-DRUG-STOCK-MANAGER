name: Hourly KPI Metrics (today, real-time)

# Real-world request: "ส่วนเรื่อง KPI ทั้งหมดให้เก็บข้อมูลอัตโนมัติแบบเรียลไทม์" — the existing
# daily-metrics.yml only finalizes YESTERDAY once, shortly after midnight, so today's own numbers
# never show up in dailyMetrics until the following midnight. This re-runs collect-daily-metrics.mjs
# for TODAY (Asia/Bangkok) every hour throughout the day, overwriting that same day's doc each time
# (the script already writes with .set(), keyed by date — see its own "Idempotent" comment), so the
# "📅 ตัวชี้วัดย้อนหลัง" report tab can show a near-real-time view of today while the day is still
# in progress. daily-metrics.yml still runs once at midnight to produce the FINAL, stable snapshot
# of the day that just ended — this workflow never touches a past day.
#
# Bug fix (Firestore quota incident, 2026-10-16): this used to fire all 24 hours of the day,
# including overnight (00:00-06:00 Asia/Bangkok) when the pharmacy isn't operating and nobody is
# looking at the "📅 ตัวชี้วัดย้อนหลัง" tab — 9 of those 24 daily runs (even after the lots/
# pendingReceives read-reduction fixes in collect-daily-metrics.mjs) were pure background cost
# with zero real freshness benefit to anyone. Narrowed to 06:00-21:00 Asia/Bangkok (23:00-14:00
# UTC, wrapping past midnight) — generous bounds covering an early morning open through an
# evening shift — still hourly, still real-time, during every hour someone could plausibly check
# the tab; cuts the daily run count from 24 to 16 with no loss anyone would actually notice.
on:
  schedule:
    - cron: '0 0-14,23 * * *' # hourly, 06:00-21:00 Asia/Bangkok (23:00-14:00 UTC) only
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute today's date (Asia/Bangkok, fixed UTC+7)
        id: today
        run: echo "date=$(date -u -d '+7 hours' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - run: node scripts/collect-daily-metrics.mjs --date=${{ steps.today.outputs.date }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
