name: (Temporary) Backfill Return Reasons

# One-time migration run — see scripts/backfill-return-reasons.mjs's own header comment.
# This workflow file is removed again once the migration has actually run; it is NOT meant
# to stay in the repo long-term (unlike the scheduled workflows alongside it).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Actually write changes (leave false for a dry run)'
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/backfill-return-reasons.mjs ${{ inputs.confirm && '--confirm' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
