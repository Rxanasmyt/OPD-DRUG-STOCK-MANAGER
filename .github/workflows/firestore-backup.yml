name: Firestore Backup

# Daily export of every Firestore collection — the free-tier (Spark plan) alternative to
# Firestore's built-in Scheduled Backups feature, which requires the Blaze billing plan. See
# scripts/backup-firestore.mjs for what gets backed up and how, and scripts/restore-firestore.mjs
# for how to restore one of these files back into Firestore.
#
# Bug fix (security/privacy incident, system analysis — this repo is PUBLIC so GitHub Pages can
# keep serving the live app for free; GitHub Pages on a private repo needs a paid GitHub plan):
# this workflow used to upload the full daily backup — meds/lots/users/txs/auditLog, i.e. the
# ENTIRE hospital database — as a GitHub Actions artifact via actions/upload-artifact@v4. For a
# public repo, Actions artifacts are downloadable by ANYONE with a free GitHub account, no
# authorization check at all — this had been quietly exposing real patient-adjacent pharmacy
# stock/transaction data to the public internet every day. Fixed by pushing the backup files (and
# the incremental-backup cursor state for txs/auditLog — see backup-firestore.mjs's own comment)
# into a SEPARATE, PRIVATE repo instead of an artifact on this public one. This repo's own content
# never changes — no backup data is ever committed here.
#
# One-time setup (do this once, in GitHub's settings — two repos involved):
#   1. Firebase Console → project opd-drug-stock → ⚙️ Project settings → Service accounts
#      → "Generate new private key" — downloads a serviceAccountKey.json file.
#   2. This repo → Settings → Secrets and variables → Actions → New repository secret
#      → name it FIREBASE_SERVICE_ACCOUNT_KEY → paste the ENTIRE contents of that JSON file.
#      → Delete the downloaded file from your computer once it's pasted in — treat it like a
#        password (it grants full read/write access to the Firestore database).
#   3. Create a separate PRIVATE repo to hold backup data (e.g. <owner>/OPD-DRUG-STOCK-MANAGER-
#      backups) — this repo's own visibility stays public, only the backup repo is private.
#   4. On github.com → Settings (top-right profile menu, not the repo's) → Developer settings →
#      Personal access tokens → Fine-grained tokens → Generate new token. Repository access:
#      "Only select repositories" → pick the backup repo only. Permissions → Repository
#      permissions → Contents: Read and write. Generate, copy the token.
#   5. This repo → Settings → Secrets and variables → Actions → New repository secret
#      → name it BACKUP_REPO_TOKEN → paste the token from step 4. Delete it from your clipboard/
#      notes once saved — it's a password scoped to just the backup repo.
#   6. This repo → Settings → Secrets and variables → Actions → New repository variable
#      → name it BACKUP_REPO → value <owner>/<backup-repo-name> (e.g.
#      Rxanasmyt/OPD-DRUG-STOCK-MANAGER-backups).
#
# Until FIREBASE_SERVICE_ACCOUNT_KEY exists, this workflow fails every run with a clear "env var
# is not set" error (see the script) rather than silently doing nothing. Until BACKUP_REPO_TOKEN/
# BACKUP_REPO exist, the "checkout backup repo" step below fails clearly instead.

on:
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 02:00 Asia/Bangkok — once a day, off-hours
  workflow_dispatch: # lets you also trigger a backup on demand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Kept in step with deploy-pages.yml/ci.yml's own pin at 22 — this workflow doesn't run
          # the test suite itself so 20 never actually broke here, but pinning it separately was
          # a landmine: adding any test step later would immediately hit the same known Node
          # 20/jsdom/undici failure ci.yml's comment documents.
          node-version: 22
          cache: npm
      - run: npm ci
      # The private backup repo — holds yesterday's (and every previous day's) incremental-backup
      # cursor state for txs/auditLog, plus every backup file this workflow has ever produced.
      # Checked out with a fine-grained PAT scoped to ONLY this one repo (see this file's header
      # comment, step 4) so actions/checkout's own credential helper can push back to it later —
      # the default GITHUB_TOKEN only has permission on the repo the workflow itself runs in.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo
      - id: backup
        run: node scripts/backup-firestore.mjs --state-dir=backup-repo/state --out-dir=backup-repo/backups
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      # Proves the file this run just produced can actually be restored — not just that it was
      # written. Fails the whole run (GitHub emails the repo owner by default on a failed
      # scheduled workflow) if a real document doesn't round-trip write->read correctly. See
      # scripts/verify-backup.mjs for exactly what this checks and why.
      - run: node scripts/verify-backup.mjs "${{ steps.backup.outputs.file }}"
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      # Proves restore-firestore.mjs ITSELF still runs end-to-end against today's real backup
      # shape — no --confirm, so this never writes anything (see that script's own safety
      # comment) — closing the gap that the actual restore script had zero automated coverage of
      # any kind before this: a bug in its arg parsing, row validation, or batching would
      # otherwise only surface the one day someone needs it during a real incident.
      - run: node scripts/restore-firestore.mjs "${{ steps.backup.outputs.file }}"
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      # Commits and pushes today's backup file + the refreshed incremental-cursor state into the
      # private backup repo. This repo (the public one) never gets backup data committed to it.
      - name: Commit and push to backup repo
        working-directory: backup-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing new to commit." || git commit -m "Firestore backup $(date -u +%Y-%m-%dT%H-%M-%SZ)"
          git push
