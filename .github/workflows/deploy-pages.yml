name: Deploy to GitHub Pages

# Builds the app and pushes the static output to the gh-pages branch.
# One-time setup in the repo: Settings → Pages → Source → "Deploy from a
# branch" → Branch: gh-pages / (root). After that, every push to main
# redeploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Bug fix: two quick successive pushes to main (a squash-merge habit, or a follow-up push right
# after another) used to start two build-and-deploy jobs in parallel, both writing to gh-pages
# via peaceiris/actions-gh-pages@v4 — a real race that can leave gh-pages on a mismatched/older
# bundle depending on which job's push wins. Queuing (not cancelling) keeps every push's deploy
# from being silently dropped, same guarantee ci.yml's own commit-by-commit gating relies on.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # See ci.yml's own comment on this pin — Node 20 fails `npm test` on this repo's
          # jsdom/undici combo, which now matters here too since this job runs the suite below.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Bug fix: this workflow used to go straight from `npm ci` to `npm run build` — `build`
      # (tsc -b && vite build) only catches type errors, not a failing test. ci.yml runs the
      # suite on every push already, but it's a separate, non-blocking workflow — nothing here
      # stopped a change that type-checks and builds but fails vitest from still deploying to
      # production. Safety-critical stock app: a red test suite should never reach gh-pages.
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      # Real-world request: "อยากให้เมื่อมีการ merge เข้า main แล้ว อยากให้มีการอัพเดตเวอชั่นที่
      # รวดเร็ว" — see scripts/publish-app-version.mjs's own header comment for the full design:
      # this pushes the new version to every open tab via Firestore's real-time listener instead
      # of waiting on the service worker's own up-to-3-minute poll. The step above only pushes to
      # the gh-pages BRANCH — GitHub's own publish of that branch to the live site (a separate,
      # GitHub-run step this workflow doesn't control) takes a bit longer, observed consistently
      # around 25-30s. The sleep gives that a safety margin so this signal doesn't fire while the
      # new build is still a few seconds from actually being fetchable — a client whose SW
      # re-check lands in that gap just finds nothing new yet and the existing 3-minute poll
      # catches it moments later regardless, so this is a latency optimization, not a
      # correctness requirement. continue-on-error: a hiccup here (e.g. a transient Firestore
      # write failure) must never mark the deploy itself as failed — the real deploy already
      # succeeded by this point, and the pre-existing polling-based update check still works as
      # the fallback either way.
      - run: sleep 30 && node scripts/publish-app-version.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        continue-on-error: true
