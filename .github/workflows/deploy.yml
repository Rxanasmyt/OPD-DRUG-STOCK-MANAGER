name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'claude/pharmacy-expiry-system-h1d3iy']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: opd-app/package-lock.json
      - run: npm ci
        working-directory: opd-app
      - run: npm run build
        working-directory: opd-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: opd-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
