name: Reset User Password

# Admin password reset for someone who forgot theirs — see scripts/reset-user-password.mjs and
# docs/ADMIN_PASSWORD_RESET.md. Manual only: Actions tab → "Reset User Password" → Run workflow →
# type the person's username. The random temporary password appears in this run's SUMMARY page
# (not in the log); anyone who can read the repo's Actions runs can see it, so delete the run once
# you've noted it. Reuses the FIREBASE_SERVICE_ACCOUNT_KEY secret the other scripts use.

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username of the person who forgot their password (e.g. somsri)'
        required: true
        type: string

permissions:
  contents: read

# One reset at a time.
concurrency:
  group: reset-user-password
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/reset-user-password.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          RESET_USERNAME: ${{ inputs.username }}
