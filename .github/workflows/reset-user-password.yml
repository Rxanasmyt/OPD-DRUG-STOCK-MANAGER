name: Reset User Password

# Admin password reset for someone who forgot theirs — see scripts/reset-user-password.mjs and
# docs/ADMIN_PASSWORD_RESET.md. Manual only: Actions tab → "Reset User Password" → Run workflow →
# type the person's username. This repo is PUBLIC, so nothing secret is ever printed here: the
# temporary password is stored in Firestore (passwordResets/, admin-readable only) and the admin
# reads it in the app. Reuses the FIREBASE_SERVICE_ACCOUNT_KEY secret the other scripts use.

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username of the person who forgot their password (e.g. somsri)'
        required: true
        type: string
      allow_admin:
        description: 'Tick ONLY to reset an app ADMIN account (refused otherwise)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One reset at a time.
concurrency:
  group: reset-user-password
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/reset-user-password.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          RESET_USERNAME: ${{ inputs.username }}
          ALLOW_ADMIN_RESET: ${{ inputs.allow_admin }}
