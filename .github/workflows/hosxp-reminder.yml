name: HOSxP Not Reconciled Reminder

# Weekdays 15:00 (Asia/Bangkok): if nobody has done "นำเข้า HOSxP" today, remind the LINE group (MOPH Notify). Silent when it was done.
# Needs the same secrets as low-stock-notify.yml (FIREBASE_SERVICE_ACCOUNT_KEY, MOPH_NOTIFY_CLIENT_KEY, MOPH_NOTIFY_SECRET_KEY).
# Optional repo variable HOLIDAYS = comma-separated YYYY-MM-DD public holidays to skip (the app has no holiday calendar).

# Exact Thai time: GitHub's scheduler is UTC and often starts runs minutes late, so the job starts 30 min EARLY and the script waits for the exact
# Bangkok minute (TARGET_TIME_BKK, set only for scheduled runs) before reading data and sending. A manual run sends at once.
on:
  schedule:
    - cron: '30 7 * * 1-5' # starts 14:30 Asia/Bangkok Mon–Fri (= 07:30 UTC); sends at exactly 15:00 (round 1)
    - cron: '0 9 * * 1-5' # starts 16:00 Asia/Bangkok Mon–Fri (= 09:00 UTC); sends at exactly 16:30 ONLY if still not done (round 2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ทดสอบ: ตรวจและพิมพ์ผลใน log แต่ไม่ส่งเข้า LINE'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/notify-hosxp-missing.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          TARGET_TIME_BKK: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 9 * * 1-5' && '16:30' || '15:00') || '' }}
          REMINDER_ROUND: ${{ github.event.schedule == '0 9 * * 1-5' && '2' || '1' }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          MOPH_NOTIFY_CLIENT_KEY: ${{ secrets.MOPH_NOTIFY_CLIENT_KEY }}
          MOPH_NOTIFY_SECRET_KEY: ${{ secrets.MOPH_NOTIFY_SECRET_KEY }}
          HOLIDAYS: ${{ vars.HOLIDAYS }}
